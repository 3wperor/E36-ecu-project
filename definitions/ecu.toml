# E36 M52 ECU — single source of truth for the tune layout and live data.
#
#   python3 tools/codegen/gen.py      (also run by `make` in firmware/)
#
# generates:
#   firmware/src/generated/tune_def.h   page sizes, offsets, raw accessors, defaults
#   firmware/src/generated/realtime.h   realtime_t (live data sent to the tuner)
#   tuner/e36ecu.ini                    TunerStudio project definition
#   tuner/ecu_def.json                  layout for tools/ecu_cli.py and our own tuner
#
# Value encoding follows TunerStudio:  shown value = (raw + translate) * scale
# Defaults below are in shown units; the generator converts them to raw.
# Arrays: shape = [n] or [x, y] (x varies fastest in memory, like TunerStudio).
#
# DEFAULTS ARE A SAFE STARTING POINT, NOT A TUNE: rich, retarded, outputs off.
# Injector flow, MAF curve and dead times must be set for the real parts.

[meta]
signature = "E36ECU-dev-p4"
version = "E36 ECU firmware 0.4.0 (phase 4: engine maths + tune storage)"

# ============================================================== page 0: settings
[[pages]]
id = 0
name = "settings"

# ---- engine and injectors
[[pages.fields]]
name = "displacement"
type = "U16"
units = "cc"
min = 500
max = 6000
default = 2494
help = "Total engine displacement (M52B25: 2494 cc)."

[[pages.fields]]
name = "injFlow"
type = "U16"
units = "cc/min"
min = 50
max = 2000
default = 250
help = "Injector flow at the actual fuel pressure. PLACEHOLDER: set from the motorcycle injectors' data."

[[pages.fields]]
name = "fuelDensity"
type = "U16"
units = "g/cc"
scale = 0.001
min = 0.6
max = 0.9
digits = 3
default = 0.745
help = "Fuel density (petrol about 0.745)."

[[pages.fields]]
name = "injDeadV"
type = "U08"
shape = [6]
units = "V"
scale = 0.1
min = 6
max = 20
digits = 1
default = [8, 10, 12, 14, 16, 18]

[[pages.fields]]
name = "injDead"
type = "U16"
shape = [6]
units = "us"
min = 0
max = 5000
default = [1500, 1100, 850, 700, 600, 520]
help = "Injector opening (dead) time vs battery voltage. PLACEHOLDER: typical high-impedance values."

# ---- ignition
[[pages.fields]]
name = "tdcOffset"
type = "U16"
units = "deg"
scale = 0.1
min = 0
max = 719.9
digits = 1
default = 0
help = "Cylinder 1 compression TDC, degrees after decoder tooth 0. Set with a timing light."

[[pages.fields]]
