type = "U08"
shape = [6]
units = "V"
scale = 0.1
min = 6
max = 20
digits = 1
default = [8, 10, 12, 14, 16, 18]

[[pages.fields]]
name = "dwell"
type = "U16"
shape = [6]
units = "us"
min = 500
max = 8000
default = [5000, 4000, 3200, 2800, 2500, 2300]
help = "Coil charge time vs battery voltage (stock M52 coils: about 3 ms at 14 V)."

[[pages.fields]]
name = "cylIgnTrim"
type = "U08"
shape = [6]
units = "deg"
scale = 0.5
translate = -20
min = -10
max = 10
digits = 1
