[SettingContextHelp]
   displacement = "Total engine displacement (M52B25: 2494 cc)."
   injFlow = "Injector flow at the actual fuel pressure. PLACEHOLDER: set from the motorcycle injectors' data."
   fuelDensity = "Fuel density (petrol about 0.745)."
   injDead = "Injector opening (dead) time vs battery voltage. PLACEHOLDER: typical high-impedance values."
   tdcOffset = "Cylinder 1 compression TDC, degrees after decoder tooth 0. Set with a timing light."
   dwell = "Coil charge time vs battery voltage (stock M52 coils: about 3 ms at 14 V)."
   cylIgnTrim = "Per-cylinder timing trim, cylinders 1-6."
   cltAdv = "Timing added vs coolant temperature."
   crankRpm = "Below this the engine is cranking: cranking fuel and fixed timing."
   crankPw = "Cranking pulse width per cycle vs coolant. PLACEHOLDER: starting point."
   afterStart = "Extra fuel right after the engine starts, fading out over afterStartTime."
   warmup = "Fuel multiplier vs coolant (100 = none)."
   aeAdd = "Extra fuel vs throttle opening speed."
   revLimit = "Fuel cut above this. Start low until the engine is tuned."
   loadSource = "How air mass is measured: MAF (stock intake), Alpha-N (throttle x rpm VE table) or a blend of both."
   ignEnable = "Ignition outputs. OFF in the default tune for safety."
   injEnable = "Injector outputs. OFF in the default tune for safety."
   cylFuelTrim = "Per-cylinder fuel trim, cylinders 1-6."
   mafFlow = "MAF transfer curve. PLACEHOLDER shape only: replace with the curve for the actual HFM part number and correct with the wideband."
   thermAdc = "Thermistor curve ADC points (2.49 k pull-up). Defaults: NTC with 2.5 k at 20 C and 0.33 k at 80 C (typical Bosch/BMW sensor); check against the real sensor."
   thermC = "Temperature at each thermistor ADC point (used for coolant and intake air)."
   vbatScale = "Battery divider ratio (input volts per ADC volt)."
   afrAt0V = "Wideband controller output: AFR at 0 V."
   afrAt5V = "Wideband controller output: AFR at 5 V."
   baro = "Barometric pressure for the Alpha-N air density."
   tpsBins = "Throttle axis, bunched at small openings for ITBs."
   loadBins = "Load axis: air mass per cylinder per intake stroke."
   veTable = "Alpha-N volumetric efficiency, rpm x throttle."
   blendTable = "Weight of the MAF in the load when loadSource = Blend (100 = MAF only, 0 = Alpha-N only)."
   mafTrim = "Correction to the MAF reading, rpm x throttle (ITB pulsation)."
   afrTable = "Target air/fuel ratio, rpm x load."
   ignTable = "Ignition advance, rpm x load. Default is deliberately conservative."
   eoiTable = "End of injection, degrees before compression TDC (360+ = closed intake valve)."

